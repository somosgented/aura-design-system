<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura DESIGN.md — Preview</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --spacing: 13px;
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        --gray-1: #fcfaff;
        --gray-2: #f9f6ff;
        --gray-3: #f0ecff;
        --gray-6: #d9d1ff;
        --gray-11: #6949bf;
        --gray-12: #27005f;
        --accent-9: #4015ca;
        --accent-10: #3500b6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --gray-1: #100b21;
          --gray-2: #19152b;
          --gray-3: #231d3c;
          --gray-6: #3c2d6c;
          --gray-11: #b5a2ff;
          --gray-12: #eeecff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-sans);
        background: var(--gray-1);
        color: var(--gray-12);
        line-height: 1.35;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(var(--spacing) * 2);
      }

      main {
        width: 100%;
        max-width: calc(var(--spacing) * 40);
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: calc(var(--spacing) * 0.5);
        margin: 0 0 calc(var(--spacing) * 1.5);
        font-size: clamp(1.17225rem, 4.03vw, 1.563rem);
        font-weight: 600;
        color: var(--gray-12);
        letter-spacing: -0.02em;
      }

      .brand-lockup svg {
        width: 1em;
        height: 1em;
        flex-shrink: 0;
      }

      h1 {
        margin: 0 0 calc(var(--spacing) * 0.5);
        font-size: clamp(1.58665rem, 4.03vw, 2.441rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 calc(var(--spacing) * 2);
        font-size: clamp(1rem, 4.03vw, 1rem);
        color: var(--gray-11);
        max-width: 42ch;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 1);
      }

      a {
        display: block;
        padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 2);
        border-radius: calc(var(--spacing) * 1);
        text-decoration: none;
        font-weight: 500;
        color: var(--gray-12);
        background: var(--gray-2);
        border: 1px solid var(--gray-6);
        box-shadow: 0 2px 8px color-mix(in srgb, var(--gray-12) 6%, transparent);
        transition: transform 200ms cubic-bezier(0.4, 0, 0.6, 1),
          border-color 200ms ease,
          background 200ms ease;
      }

      a:hover {
        background: var(--gray-3);
        border-color: var(--accent-9);
        transform: scale(1.02);
      }

      a:active {
        transform: scale(0.98);
      }

      a span {
        display: block;
        margin-top: calc(var(--spacing) * 0.5);
        font-size: 0.875rem;
        font-weight: 400;
        color: var(--gray-11);
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: border-color 200ms ease, background 200ms ease;
        }
        a:hover,
        a:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DESIGN.md preview</h1>
      <p>Choose a theme for the static Aura design specification preview.</p>
      <ul>
        <li>
          <a href="preview.html">
            Light preview
            <span>Open preview.html — default light tokens</span>
          </a>
        </li>
        <li>
          <a href="preview-dark.html">
            Dark preview
            <span>Open preview-dark.html — dark theme tokens</span>
          </a>
        </li>
        <li>
          <a href="DESIGN.md">
            Open DESIGN.md
            <span>Open DESIGN.md — the design specification</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
