# Substituted by the nginx image entrypoint (${PORT} → 3000 on Cloud Run).
# Mirrors packages/design-md/vercel.json: /dark rewrite and DESIGN.md content type.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    location = /dark {
        rewrite ^ /preview-dark.html last;
    }

    location = /DESIGN.md {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
