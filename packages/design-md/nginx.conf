# Substituted by the nginx image entrypoint (${PORT} → 3000 on Cloud Run).
# Serves markdown as text/markdown and opens CORS so agents in other projects can fetch flavors.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~ ^/designs/[a-z0-9-]+$ {
        return 301 $uri/;
    }

    location ~ ^/designs/[a-z0-9-]+/$ {
        add_header Cache-Control "no-store";
        try_files /detail.html =404;
    }

    location /designs/ {
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /designs.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /detail.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
