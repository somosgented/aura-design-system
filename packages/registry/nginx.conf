# Substituted by the nginx image entrypoint (${PORT} → 3000 on Cloud Run).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Ladle is a single-page story shell (query `?story=`).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
